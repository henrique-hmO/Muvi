const WORDS = [];

// ---------- helpers ----------

// film grain

// fill with left-lit / right-shaded gradient
function sh(c, x0, x1, light, dark) { return lin(c, x0, 0, x1, 0, [[0, light], [.55, light], [1, dark]]); }

// Full-body front. o:{hair:'long'|'grey', shirt, pants, skin, creepy}
function figFront(c, x, y, h, o) {

// back view walking
